[project]
name = "nitpix-review"
version = "0.6.1"
license = "MIT"
license-files = ["LICENSE"]
description = "nitpix: delivery QC for video, audio, stills and image sequences, with frame-accurate review on embedded libmpv."
requires-python = ">=3.13,<3.16"
dependencies = [
    "assimp-py>=1.2",
    "PySide6>=6.12",
    "python-mpv>=1.0.8",
    "reportlab>=5.1",
]

[project.scripts]
nitpix = "nitpix.__main__:main"

[tool.uv]
# Development and the app bundle use the interpreter in .python-version (uv-managed).
python-preference = "managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nitpix"]
