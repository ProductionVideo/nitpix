[project]
name = "nitpix-review"
version = "0.5.2"
license = "MIT"
license-files = ["LICENSE"]
description = "nitpix: delivery QC for video, audio, stills and image sequences, with frame-accurate review on embedded libmpv."
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8",
    "python-mpv>=1.0.7",
    "reportlab>=3.6",
]

[project.scripts]
nitpix = "nitpix.__main__:main"

[tool.uv]
# PySide6 publishes wheels up to Python 3.13; pin the interpreter uv creates.
python-preference = "managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nitpix"]
